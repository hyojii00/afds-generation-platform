services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: afds_generation_platform
      POSTGRES_USER: afds
      POSTGRES_PASSWORD: afds
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afds -d afds_generation_platform"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
